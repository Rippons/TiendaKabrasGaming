<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - KabrasGaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <h2 class="text-center">Registro</h2>
                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Registrar</button>
                </form>
                <div id="message" class="mt-3"></div>
                <div class="text-center mt-3">
                    <p>¿Ya tienes una cuenta? <a href="/login" class="btn btn-link">Inicia sesión aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevenir el envío del formulario por defecto

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('https://localhost:7239/Usuarios', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ Username: username, Password: password }),
                });

                const result = await response.json();

                if (response.ok) {
                    // Registro exitoso
                    document.getElementById('message').innerText = 'Registro exitoso';
                    setTimeout(() => {
                        window.location.href = '/'; // Redirigir a la ruta principal
                    }, 2000); // Esperar 2 segundos antes de redirigir
                } else {
                    // Mostrar mensaje de error
                    document.getElementById('message').innerText = result.error || 'Error en el registro';
                }
            } catch (error) {
                // Manejar errores en la solicitud
                console.error('Error en la solicitud:', error);
                document.getElementById('message').innerText = 'Error en la solicitud';
            }
        });
    </script>
</body>
</html>
